name: Build & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            norsk/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Nordlys, the Norwegian app, is published next to Shoresh under /norsk/.
      - run: npm ci
        working-directory: norsk
      - run: npm test
        working-directory: norsk
      - run: npm run build
        working-directory: norsk
      - run: cp -r norsk/dist dist/norsk
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  # GitHub Pages is free for public repositories. Private repos need a paid plan,
  # so this job only runs when the repository is public.
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
